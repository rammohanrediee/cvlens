name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements/dev.txt
      - run: ruff check backend tests
      - run: python -m pip check
      - name: Audit application dependencies
        run: pip-audit -r requirements.txt
      - run: coverage run --source=backend.app -m unittest discover -s tests -v
      - run: coverage report -m --fail-under=80

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cvlens-api:test .
      - name: Start backend
        run: docker run -d --name cvlens-api -e API_HOST=0.0.0.0 -e PORT=8001 -p 8001:8001 cvlens-api:test bash start-backend.sh
      - name: Verify health endpoint
        run: |
          for attempt in 1 2 3 4 5; do
            curl --fail http://127.0.0.1:8001/api/v1/health && exit 0
            sleep 2
          done
          docker logs cvlens-api
          exit 1
