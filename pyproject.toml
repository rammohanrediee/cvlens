[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-analyzer"
version = "1.0.0"
description = "ATS-style resume analysis with a Streamlit UI and HTTP API."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
backend = ["app/assets/fonts/*.ttf", "app/assets/fonts/*.txt"]
frontend = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/images/*.png"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
