<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Review a resume and compare it with a target job." />
    <meta name="theme-color" content="#f6f8f7" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230d7655'/%3E%3Ccircle cx='29' cy='29' r='13' fill='none' stroke='white' stroke-width='6'/%3E%3Cpath d='m39 39 10 10' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('cvlens-theme')
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>cvLens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
